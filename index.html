<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>一站式AI开发平台原型</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #f7faff;
      --line: #dbe4f0;
      --text: #1c2a3a;
      --text-sub: #607085;
      --brand: #1677ff;
      --brand-soft: #eaf2ff;
      --ok: #16a34a;
      --warn: #d97706;
      --danger: #dc2626;
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --shadow-sm: 0 4px 14px rgba(20, 55, 90, 0.08);
      --shadow-md: 0 10px 30px rgba(20, 55, 90, 0.12);
      --sidebar-w: 260px;
      --topbar-h: 72px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 16% 0%, #dfeeff 0%, #f4f7fb 48%, #eef3fa 100%);
    }

    body {
      min-width: 1200px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      background: linear-gradient(180deg, #1f3f73 0%, #18335f 48%, #112848 100%);
      color: #dbe9ff;
      padding: 18px 14px;
      box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-weight: 700;
      color: #113;
      background: linear-gradient(135deg, #88ceff 0%, #8de5c7 100%);
    }

    .brand-text h1 {
      font-size: 15px;
      line-height: 1.1;
      margin: 0 0 4px;
      color: #fff;
      font-weight: 650;
      letter-spacing: 0.2px;
    }

    .brand-text p {
      margin: 0;
      font-size: 12px;
      color: #b5cdf2;
    }

    .nav-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
      overflow-y: auto;
    }

    .nav-btn {
      width: 100%;
      border: none;
      cursor: pointer;
      text-align: left;
      padding: 11px 12px;
      border-radius: 12px;
      color: #d9e8ff;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s ease;
      font-size: 14px;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .nav-btn.active {
      background: linear-gradient(135deg, rgba(56, 150, 255, 0.5) 0%, rgba(115, 247, 200, 0.35) 100%);
      color: #fff;
      box-shadow: 0 8px 24px rgba(16, 56, 114, 0.35);
    }

    .nav-icon {
      width: 20px;
      text-align: center;
      opacity: 0.95;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #c3d6f6;
      line-height: 1.5;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: var(--topbar-h) 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: var(--topbar-h);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .topbar p {
      margin: 3px 0 0;
      font-size: 12px;
      color: var(--text-sub);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .content {
      padding: 22px;
      overflow: auto;
      position: relative;
    }

    .view {
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--panel);
      border-radius: var(--radius-md);
      border: 1px solid rgba(204, 218, 236, 0.7);
      box-shadow: var(--shadow-sm);
      padding: 16px;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 17px;
      font-weight: 650;
    }

    .muted {
      color: var(--text-sub);
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 11px;
      padding: 9px 14px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.18s ease;
      line-height: 1;
      white-space: nowrap;
    }

    .btn.primary {
      background: linear-gradient(135deg, #1677ff 0%, #139de8 100%);
      color: #fff;
      box-shadow: 0 10px 22px rgba(22, 119, 255, 0.23);
    }

    .btn.primary:hover {
      transform: translateY(-1px);
    }

    .btn.ghost {
      background: #fff;
      color: var(--text);
      border-color: var(--line);
    }

    .btn.ghost:hover {
      background: #f6f9ff;
    }

    .btn.soft {
      background: var(--brand-soft);
      color: var(--brand);
    }

    .btn.warn {
      background: #fff5e9;
      color: #b45309;
    }

    .btn.danger {
      background: #fff0f0;
      color: #c81e1e;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .grid-3 {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid-2 {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .metric {
      padding: 16px;
      border-radius: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #f9fcff 100%);
      border: 1px solid #dfe8f4;
      box-shadow: var(--shadow-sm);
    }

    .metric .k {
      font-size: 28px;
      line-height: 1.1;
      margin: 8px 0 0;
      font-weight: 720;
      color: #17345f;
    }

    .metric small {
      color: #678;
    }

    .role-switch {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .role-btn {
      border: 1px solid #d8e5f7;
      background: #fff;
      color: #28486c;
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .role-btn.active {
      background: linear-gradient(135deg, #1677ff 0%, #28b2f5 100%);
      color: #fff;
      border-color: transparent;
    }

    .timeline {
      margin: 0;
      padding: 0 0 0 14px;
      list-style: none;
      border-left: 2px dashed #c9d9ec;
      display: grid;
      gap: 10px;
    }

    .timeline li {
      position: relative;
      padding-left: 14px;
      font-size: 13px;
    }

    .timeline li::before {
      content: "";
      position: absolute;
      left: -20px;
      top: 6px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1f8fff;
      box-shadow: 0 0 0 4px #e7f2ff;
    }

    .tag {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #edf4ff;
      color: #315d99;
      border: 1px solid #d8e8ff;
    }

    .project-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .project-card {
      border: 1px solid #deebfb;
      border-radius: 14px;
      padding: 12px;
      background: linear-gradient(180deg, #fff 0%, #f9fcff 100%);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .project-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .project-card.active {
      border-color: #8ec6ff;
      box-shadow: 0 12px 24px rgba(17, 110, 218, 0.15);
    }

    .project-card h4 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .project-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: #5f7591;
    }

    .split {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 12px;
    }

    .file-tree {
      border: 1px solid #deebfb;
      background: #f8fbff;
      border-radius: 12px;
      padding: 10px;
      display: grid;
      gap: 8px;
      align-content: start;
      height: 420px;
    }

    .file-tree button {
      border: 1px solid transparent;
      background: #fff;
      border-radius: 9px;
      font-size: 13px;
      text-align: left;
      padding: 8px;
      cursor: pointer;
      color: #335;
    }

    .file-tree button.active {
      border-color: #a4d0ff;
      background: #eef6ff;
    }

    .editor-wrap {
      border: 1px solid #deebfb;
      border-radius: 12px;
      overflow: hidden;
      background: #f7faff;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 420px;
    }

    .editor-head {
      padding: 10px 12px;
      border-bottom: 1px solid #deebfb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #fff;
    }

    .code-editor {
      width: 100%;
      height: 270px;
      border: none;
      resize: none;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.55;
      padding: 12px;
      outline: none;
      background: #0f1729;
      color: #d4edff;
    }

    .output {
      background: #0a1220;
      color: #a0f0c0;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      margin: 0;
      padding: 12px;
      min-height: 110px;
      max-height: 170px;
      overflow: auto;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      white-space: pre-wrap;
    }

    .upload-zone {
      border: 2px dashed #9cc6f4;
      border-radius: 16px;
      padding: 26px;
      text-align: center;
      background: linear-gradient(180deg, #fbfdff 0%, #f0f8ff 100%);
      color: #395676;
      cursor: pointer;
      transition: all 0.2s;
    }

    .upload-zone.dragging {
      border-color: #268aff;
      background: #ebf4ff;
    }

    .progress {
      margin-top: 12px;
      background: #e7effa;
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
    }

    .progress > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #1a7dff 0%, #25c3e8 100%);
      width: 0;
      transition: width 0.25s ease;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }

    th,
    td {
      padding: 10px 9px;
      border-bottom: 1px solid #ebf1f8;
      text-align: left;
    }

    th {
      background: #f5f9ff;
      color: #416385;
      font-weight: 650;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .annotation-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .anno-item {
      border: 1px solid #dce9f8;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
    }

    .anno-preview {
      height: 110px;
      display: grid;
      place-items: center;
      color: #345;
      font-size: 30px;
      background: linear-gradient(135deg, #daf0ff 0%, #f5f8ff 100%);
      border-bottom: 1px solid #dce9f8;
    }

    .anno-body {
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .seg {
      display: inline-flex;
      border-radius: 999px;
      border: 1px solid #d2e4fa;
      overflow: hidden;
    }

    .seg button {
      border: none;
      background: #fff;
      color: #356;
      padding: 7px 11px;
      font-size: 12px;
      cursor: pointer;
    }

    .seg button.active {
      background: #e8f3ff;
      color: #1255b2;
      font-weight: 650;
    }

    .form-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 12px;
      color: #4f6680;
      font-weight: 600;
    }

    .field input,
    .field select,
    .field textarea {
      border: 1px solid #cedff2;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      outline: none;
      background: #fff;
      color: var(--text);
    }

    .field textarea {
      min-height: 80px;
      resize: vertical;
    }

    .switch {
      position: relative;
      width: 48px;
      height: 26px;
      background: #d5e3f5;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s;
      border: none;
      padding: 0;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
      box-shadow: 0 2px 5px rgba(16, 42, 90, 0.24);
    }

    .switch.on {
      background: #2a9bff;
    }

    .switch.on::after {
      transform: translateX(22px);
    }

    .chip-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      border: 1px solid #d2e4fa;
      background: #fff;
      color: #355;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .chip.active {
      background: #e9f4ff;
      color: #0f57b2;
      border-color: #8ec1f8;
      font-weight: 650;
    }

    .status {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      display: inline-block;
      border: 1px solid;
    }

    .status.running {
      color: #0f766e;
      border-color: #82e6dd;
      background: #e8fff9;
    }

    .status.success {
      color: #166534;
      border-color: #9fe4b4;
      background: #effff3;
    }

    .status.failed {
      color: #b91c1c;
      border-color: #f8b0b0;
      background: #fff0f0;
    }

    .chart {
      width: 100%;
      height: 300px;
      border: 1px solid #dbe8f8;
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }

    .model-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .model-card {
      border: 1px solid #dbe8f8;
      border-radius: 14px;
      background: linear-gradient(180deg, #fff 0%, #f9fcff 100%);
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .model-card h4 {
      margin: 0;
      font-size: 15px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #134788;
      background: #d6ebff;
      border: 1px solid #c3dcf6;
    }

    .member-row {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border: 1px solid #e1ebf7;
      border-radius: 12px;
      background: #fff;
      margin-bottom: 8px;
    }

    .member-row:last-child {
      margin-bottom: 0;
    }

    .sample-run-card {
      position: fixed;
      right: 24px;
      bottom: 22px;
      width: 260px;
      z-index: 45;
      border: 1px solid #d6e5f7;
      border-radius: 16px;
      background: linear-gradient(160deg, #ffffff 0%, #eef6ff 100%);
      box-shadow: var(--shadow-md);
      padding: 13px;
      display: grid;
      gap: 8px;
    }

    .sample-run-card h4 {
      margin: 0;
      font-size: 14px;
    }

    .sample-run-card p {
      margin: 0;
      color: #5c7390;
      font-size: 12px;
      line-height: 1.4;
    }

    .modal-root {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
    }

    .modal-mask {
      position: absolute;
      inset: 0;
      background: rgba(7, 18, 36, 0.45);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.97);
      width: min(600px, calc(100vw - 36px));
      max-height: calc(100vh - 36px);
      overflow: auto;
      border-radius: 16px;
      border: 1px solid #d5e2f3;
      background: #fff;
      box-shadow: 0 24px 40px rgba(0, 0, 0, 0.22);
      opacity: 0;
      transition: all 0.2s;
    }

    .modal-head {
      padding: 14px 16px;
      border-bottom: 1px solid #e5eef8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .modal-body {
      padding: 14px 16px;
      display: grid;
      gap: 12px;
    }

    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 0 16px 16px;
    }

    .modal-root.show {
      pointer-events: auto;
    }

    .modal-root.show .modal-mask {
      opacity: 1;
    }

    .modal-root.show .modal {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .toast-root {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 120;
      display: grid;
      gap: 8px;
    }

    .toast {
      background: #102a4b;
      color: #e9f2ff;
      padding: 10px 12px;
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      min-width: 220px;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: toastIn 0.24s ease;
    }

    .toast.success {
      background: #0f5132;
    }

    .toast.warn {
      background: #7a4d10;
    }

    .toast.error {
      background: #7f1d1d;
    }

    @keyframes toastIn {
      from {
        transform: translateY(-8px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .guide-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 10, 20, 0.55);
      z-index: 140;
      display: none;
    }

    .guide-overlay.show {
      display: block;
    }

    .guide-highlight {
      position: absolute;
      border: 2px solid #5cb6ff;
      border-radius: 14px;
      box-shadow: 0 0 0 9999px rgba(3, 10, 20, 0.52);
      pointer-events: none;
      transition: all 0.22s;
    }

    .guide-tip {
      position: absolute;
      width: 320px;
      background: #fff;
      border: 1px solid #d1e3f8;
      border-radius: 14px;
      box-shadow: var(--shadow-md);
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .guide-tip h4 {
      margin: 0;
      font-size: 15px;
    }

    .guide-tip p {
      margin: 0;
      color: #57708c;
      font-size: 13px;
      line-height: 1.45;
    }

    .tiny {
      font-size: 12px;
      color: #7088a3;
    }

    pre.code-block {
      margin: 0;
      background: #0f1a2f;
      color: #d7e5ff;
      border-radius: 10px;
      padding: 10px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.45;
    }

    @media (max-width: 1380px) {
      :root {
        --sidebar-w: 220px;
      }

      .project-grid,
      .model-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .split {
        grid-template-columns: 240px 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" data-guide="sidebar">
      <div class="brand">
        <div class="brand-badge">AI</div>
        <div class="brand-text">
          <h1>智创 AI 开发云</h1>
          <p>One-Stop Platform Prototype</p>
        </div>
      </div>
      <ul class="nav-list" id="nav-list"></ul>
      <div class="sidebar-footer">
        数据与操作全部为前端模拟<br />
        localStorage Key: <code>ai_platform_v1</code>
      </div>
    </aside>
    <section class="main">
      <header class="topbar" data-guide="topbar">
        <div>
          <h2 id="top-title">控制台</h2>
          <p id="top-subtitle">欢迎使用一站式AI开发平台原型</p>
        </div>
        <div class="topbar-actions">
          <button class="btn ghost" data-action="start-guide">新手引导</button>

          return deepMerge(clone(DEFAULT_STATE), parsed);
        } catch (error) {

          return clone(DEFAULT_STATE);
        }

      function clone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function deepMerge(target, source) {
        if (!source || typeof source !== "object") return target;
        Object.keys(source).forEach((key) => {
          if (Array.isArray(source[key])) {
            target[key] = source[key];
          } else if (source[key] && typeof source[key] === "object") {
            if (!target[key] || typeof target[key] !== "object") {
              target[key] = {};
            }
            deepMerge(target[key], source[key]);
          } else {
            target[key] = source[key];
          }
        });
        return target;

      function toast(message, type = "") {

        setTimeout(() => {

      function runNotebook() {
        if (state.ui.notebookRunning) {
          toast("Notebook 正在运行中，请稍候。", "warn");
          return;
        }
        const editor = document.getElementById("notebook-editor");
        if (editor) {
          state.notebook.codeByKernel[state.notebook.kernel] = editor.value;
        }
        state.ui.notebookRunning = true;
        state.notebook.logs = [];
        const lines = generateNotebookLogs(state.notebook.kernel);
        let cursor = 0;
        if (ui.timers.notebook) {
          clearInterval(ui.timers.notebook);
        }
        ui.timers.notebook = setInterval(() => {
          state.notebook.logs.push(lines[cursor]);
          cursor += 1;
          if (cursor >= lines.length) {
            clearInterval(ui.timers.notebook);
            ui.timers.notebook = null;
            state.ui.notebookRunning = false;
            addActivity(`Notebook(${state.notebook.kernel}) 训练完成，输出 ${lines.length} 条日志。`);
            saveState();
          }
          renderView();
          if (state.activeView === "notebook") {
            const outputEl = document.getElementById("notebook-output");
            if (outputEl) outputEl.scrollTop = outputEl.scrollHeight;
          }
        }, 420);
      }

        if (kernel === "tensorflow") {
          return [
            `[${stamp}] TensorFlow 2.13 kernel started`,
            "GPU Check: 2 device(s) ready",
            "Epoch 1/5 - loss: 1.246 - acc: 0.62",
            "Epoch 2/5 - loss: 0.973 - acc: 0.71",

            "Validation acc: 0.84",
            "Saved checkpoint => /ckpt/tf_demo/latest"
          ];
        }
        return [
          `[${stamp}] PyTorch 2.0 kernel started`,
          "CUDA visible devices: [0]",
          "Epoch 1/5 - loss: 1.201 - lr: 0.0010",
          "Epoch 2/5 - loss: 0.928 - lr: 0.0010",
          "Epoch 3/5 - loss: 0.774 - lr: 0.0008",

      function renderExperimentCharts() {
        const selected = state.experiments.find((e) => e.id === state.selectedExperimentId) || state.experiments[0];
        if (selected) {
          renderLineChart("exp-single-chart", selected.lossSeries, null, [selected.name]);
        }
        const ids = state.compareExperimentIds;
        const compareEl = document.getElementById("exp-compare-chart");
        if (!compareEl) return;
        if (ids.length !== 2) {
          disposeChart("exp-compare-chart");
          compareEl.innerHTML = `<div style="height:100%;display:grid;place-items:center;color:#6a7e96;font-size:13px;">请在上方勾选两个实验以进行曲线对比</div>`;
          return;
        }
        const expA = state.experiments.find((e) => e.id === ids[0]);
        const expB = state.experiments.find((e) => e.id === ids[1]);
        if (expA && expB) {
          renderLineChart("exp-compare-chart", expA.lossSeries, expB.lossSeries, [expA.name, expB.name]);
        }
      }

      function renderApiCharts() {
        const series = state.api7d.map((x) => x.count);
        renderLineChart("api-usage-chart", series, null, ["API 调用量"], state.api7d.map((x) => x.date));
      }

      function renderLineChart(targetId, data, compareData = null, legends = ["Loss"], xLabels = null) {
        const el = document.getElementById(targetId);
        if (!el) return;
        const labels = xLabels || data.map((_, i) => `E${i + 1}`);
        const hasEcharts = typeof window.echarts !== "undefined";

        if (hasEcharts) {
          let chart = ui.charts[targetId] || null;
          if (chart && typeof chart.getDom === "function" && chart.getDom() !== el) {
            chart.dispose();
            chart = null;
          }
          if (!chart) {
            chart = window.echarts.init(el);
          }
          ui.charts[targetId] = chart;
          const series = [
            {
              type: "line",
              data,
              smooth: true,
              name: legends[0] || "Series A",
              symbolSize: 6,
              lineStyle: { width: 3, color: "#1677ff" },
              itemStyle: { color: "#1677ff" },
              areaStyle: { color: "rgba(22,119,255,0.12)" }
            }
          ];
          if (compareData) {
            series.push({
              type: "line",
              data: compareData,
              smooth: true,
              name: legends[1] || "Series B",
              symbolSize: 6,
              lineStyle: { width: 3, color: "#13a97a" },
              itemStyle: { color: "#13a97a" }
            });
          }
          chart.setOption({
            grid: { left: 44, right: 24, top: 38, bottom: 34 },
            tooltip: { trigger: "axis" },
            legend: { top: 8, data: legends },
            xAxis: { type: "category", data: labels, axisLabel: { color: "#557" } },
            yAxis: { type: "value", axisLabel: { color: "#557" }, splitLine: { lineStyle: { color: "#e7eef8" } } },
            series
          });
          return;
        }

        renderSvgFallback(el, data, compareData, legends, labels);
      }

      function disposeChart(targetId) {
        const chart = ui.charts[targetId];
        if (chart && typeof chart.dispose === "function") {
          chart.dispose();
        }
        delete ui.charts[targetId];
      }

      function renderSvgFallback(container, data, compareData, legends, labels) {
        const all = compareData ? data.concat(compareData) : data.slice();
        const min = Math.min(...all);
        const max = Math.max(...all);
        const width = container.clientWidth || 640;
        const height = container.clientHeight || 300;
        const pad = { left: 40, right: 16, top: 18, bottom: 30 };
        const innerW = width - pad.left - pad.right;
        const innerH = height - pad.top - pad.bottom;
        const pointsA = data.map((v, i) => {
          const x = pad.left + (innerW * i) / Math.max(1, data.length - 1);
          const y = pad.top + ((max - v) / Math.max(0.0001, max - min)) * innerH;
          return `${x},${y}`;
        }).join(" ");
        const pointsB = compareData ? compareData.map((v, i) => {
          const x = pad.left + (innerW * i) / Math.max(1, compareData.length - 1);
          const y = pad.top + ((max - v) / Math.max(0.0001, max - min)) * innerH;
          return `${x},${y}`;
        }).join(" ") : "";

        const xTicks = labels.map((label, i) => {
          const x = pad.left + (innerW * i) / Math.max(1, labels.length - 1);
          return `<text x="${x}" y="${height - 8}" font-size="11" text-anchor="middle" fill="#607085">${label}</text>`;
        }).join("");

        container.innerHTML = `
          <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
            <rect x="0" y="0" width="${width}" height="${height}" fill="#fff"></rect>
            <line x1="${pad.left}" y1="${pad.top + innerH}" x2="${width - pad.right}" y2="${pad.top + innerH}" stroke="#dbe8f8"></line>
            <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${pad.top + innerH}" stroke="#dbe8f8"></line>
            <polyline fill="none" stroke="#1677ff" stroke-width="3" points="${pointsA}"></polyline>
            ${compareData ? `<polyline fill="none" stroke="#13a97a" stroke-width="3" points="${pointsB}"></polyline>` : ""}
            ${xTicks}
            <text x="${pad.left}" y="12" font-size="12" fill="#334">
              ${legends.join(" vs ")}（SVG fallback）
            </text>
          </svg>
        `;
      }

      function renderGuide() {
        const overlay = document.getElementById("guide-overlay");
        const highlight = document.getElementById("guide-highlight");
        const tip = document.getElementById("guide-tip");
        if (!ui.guide.active) {
          overlay.classList.remove("show");
          return;
        }
        const stepObj = ui.guide.steps[ui.guide.step];
        const target = document.querySelector(stepObj.selector);
        if (!target) {
          overlay.classList.remove("show");
          ui.guide.active = false;
          return;
        }
        const rect = target.getBoundingClientRect();
        overlay.classList.add("show");

        highlight.style.left = `${rect.left - 6}px`;
        highlight.style.top = `${rect.top - 6}px`;
        highlight.style.width = `${rect.width + 12}px`;
        highlight.style.height = `${rect.height + 12}px`;

        const preferredX = Math.min(window.innerWidth - 340, rect.left + rect.width + 18);
        const fallbackX = Math.max(18, rect.left - 336);
        const placeRight = preferredX >= rect.left;
        const tipX = placeRight ? preferredX : fallbackX;
        const tipY = Math.min(window.innerHeight - 180, Math.max(14, rect.top + 4));

        tip.style.left = `${tipX}px`;
        tip.style.top = `${tipY}px`;
        tip.innerHTML = `
          <h4>步骤 ${ui.guide.step + 1}/${ui.guide.steps.length} · ${stepObj.title}</h4>
          <p>${stepObj.text}</p>
          <div class="btn-row">
            <button class="btn ghost" data-action="guide-close">结束</button>
            <button class="btn ghost" data-action="guide-prev" ${ui.guide.step === 0 ? "disabled" : ""}>上一步</button>
            <button class="btn primary" data-action="guide-next">${ui.guide.step === ui.guide.steps.length - 1 ? "完成" : "下一步"}</button>
          </div>
        `;
      }

      function startGuide() {
        ui.guide.active = true;
        ui.guide.step = 0;
        renderGuide();
      }

      function closeGuide() {
        ui.guide.active = false;
        renderGuide();
      }

      function exportCsv(rows, fileName) {
        const header = "time,status,latencyMs,endpoint";
        const body = rows.map((r) => `${r.time},${r.status},${r.latencyMs},${r.endpoint}`).join("\n");
        const csv = `${header}\n${body}`;
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function escapeHtml(text) {
        return String(text)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (!target) return;
        const action = target.dataset.action;

        if (action === "switch-view") {
          setActiveView(target.dataset.view);
          return;
        }
        if (action === "switch-role") {
          state.role = target.dataset.role;
          addActivity(`角色切换为 ${ROLE_META[state.role].name}`);
          saveState();
          renderApp();
          return;
        }
        if (action === "goto-notebook") return setActiveView("notebook");
        if (action === "goto-data") return setActiveView("data");
        if (action === "goto-models") return setActiveView("models");
        if (action === "goto-api") return setActiveView("api");
        if (action === "goto-guide") return setActiveView("guide");
        if (action === "goto-experiments") return setActiveView("experiments");

        if (action === "load-paper-baseline") {
          state.notebook.kernel = "tensorflow";
          state.notebook.codeByKernel.tensorflow = `${KERNEL_SNIPPETS.tensorflow}\n\n# Paper baseline config\nBATCH_SIZE = 64\nLR = 5e-4`;
          saveState();
          setActiveView("notebook");
          toast("已导入学术基线示例到 TensorFlow Notebook。", "success");
          return;
        }

        if (action === "open-create-project") {
          openModal("create-project");
          return;
        }
        if (action === "close-modal") {
          closeModal();
          return;
        }
        if (action === "confirm-create-project") {
          const nameEl = document.getElementById("new-project-name");
          const descEl = document.getElementById("new-project-desc");
          const tagEl = document.getElementById("new-project-tag");
          const name = (nameEl && nameEl.value.trim()) || "";
          const desc = (descEl && descEl.value.trim()) || "";
          const tag = (tagEl && tagEl.value) || "L";
          if (!name) {
            toast("请输入项目名。", "warn");
            return;
          }
          const newProject = {
            id: `proj-${Date.now()}`,
            name,
            desc: desc || "暂无描述",
            tag,
            members: 1,
            createdAt: "2026-04-28",
            checkpointEnabled: true,
            envSnapshot: {
              python: "3.11",
              cuda: "12.2",
              image: "zhichuang/custom:latest",
              storage: "60GB"
            }
          };
          state.projects.unshift(newProject);
          state.selectedProjectId = newProject.id;
          state.trainingConfig.projectId = newProject.id;
          addActivity(`创建新项目：${name}`);
          saveState();
          closeModal();
          renderApp();
          toast("项目创建成功。", "success");
          return;
        }

        if (action === "select-project") {
          state.selectedProjectId = target.dataset.projectId;
          saveState();
          renderView();
          return;
        }

        if (action === "toggle-project-checkpoint") {
          const id = target.dataset.projectId;
          const project = state.projects.find((p) => p.id === id);
          if (project) {
            project.checkpointEnabled = !project.checkpointEnabled;
            saveState();
            renderView();
          }
          return;
        }

        if (action === "select-file") {
          state.ui.selectedFile = target.dataset.file;
          saveState();
          renderView();
          return;
        }

        if (action === "run-notebook") {
          runNotebook();
          saveState();
          return;
        }

        if (action === "clear-logs") {
          state.notebook.logs = [];
          saveState();
          renderView();
          return;
        }

        if (action === "switch-kernel") {
          return;
        }

        if (action === "trigger-upload") {
          const input = document.getElementById("upload-input");
          if (input) input.click();
          return;
        }

        if (action === "clean-data") {
          const type = target.dataset.cleanType;
          if (type === "dedup") {
            toast("模拟清洗完成：重复样本已去重。", "success");
            addActivity("执行数据清洗：去重。");
          } else {
            toast("模拟清洗完成：缺失值已填充。", "success");
            addActivity("执行数据清洗：缺失值填充。");
          }
          saveState();
          return;
        }

        if (action === "set-annotation") {
          setAnnotation(target.dataset.imageId, target.dataset.label);
          return;
        }

        if (action === "save-annotations") {
          addActivity("图像标注结果已保存。");
          saveState();
          toast("标注保存成功（Mock）。", "success");
          return;
        }

        if (action === "set-gpu-mode") {
          state.trainingConfig.gpuMode = target.dataset.mode;
          saveState();
          renderView();
          return;
        }

        if (action === "toggle-training-checkpoint") {
          state.trainingConfig.checkpoint = !state.trainingConfig.checkpoint;
          saveState();
          renderView();
          return;
        }

        if (action === "submit-training") {
          const cfgProject = document.getElementById("cfg-project");
          const cfgNotebook = document.getElementById("cfg-notebook");
          const cfgAutosave = document.getElementById("cfg-autosave");
          if (cfgProject) state.trainingConfig.projectId = cfgProject.value;
          if (cfgNotebook) state.trainingConfig.notebookPath = cfgNotebook.value;
          if (cfgAutosave) state.trainingConfig.autosave = Math.max(1, Number(cfgAutosave.value) || 10);
          submitTraining();
          return;
        }

        if (action === "select-experiment") {
          const expId = target.dataset.expId;
          if (expId) {
            state.selectedExperimentId = expId;
            saveState();
            renderView();
            requestAnimationFrame(renderExperimentCharts);
          }
          return;
        }

        if (action === "toggle-compare") {
          event.stopPropagation();
          const expId = target.dataset.expId;
          const checked = target.checked;
          let ids = state.compareExperimentIds.slice();
          if (checked) {
            if (!ids.includes(expId)) ids.push(expId);
            if (ids.length > 2) ids = ids.slice(ids.length - 2);
          } else {
            ids = ids.filter((id) => id !== expId);
          }
          state.compareExperimentIds = ids;
          saveState();
          renderView();
          requestAnimationFrame(renderExperimentCharts);
          return;
        }

        if (action === "deploy-model") {
          const model = state.models.find((m) => m.id === target.dataset.modelId);
          if (model) {
            addActivity(`模型 ${model.name} 已生成部署端点。`);
            saveState();
            openModal("deploy-api", { model });
          }
          return;
        }

        if (action === "export-report") {
          exportCsv(state.apiLogs, "api_report.csv");
          toast("报表已导出：api_report.csv", "success");
          addActivity("导出 API 调用报表。");
          saveState();
          return;
        }

        if (action === "open-invite-member") {
          openModal("invite-member");
          return;
        }

        if (action === "confirm-invite-member") {
          const emailEl = document.getElementById("invite-email");
          const roleEl = document.getElementById("invite-role");
          const email = emailEl ? emailEl.value.trim() : "";
          const role = roleEl ? roleEl.value : "成员";
          if (!email || !email.includes("@")) {
            toast("请输入有效邮箱。", "warn");
            return;
          }
          const name = email.split("@")[0].slice(0, 8);
          state.teamMembers.push({
            id: `u${Date.now()}`,
            name,
            email,
            role
          });
          addActivity(`邀请成员：${email}（${role}）`);
          saveState();
          closeModal();
          renderView();
          toast("邀请已发送（模拟）。", "success");
          return;
        }

        if (action === "start-guide") {
          startGuide();
          return;
        }
        if (action === "guide-close") {
          closeGuide();
          return;
        }
        if (action === "guide-prev") {
          ui.guide.step = Math.max(0, ui.guide.step - 1);
          renderGuide();
          return;
        }
        if (action === "guide-next") {
          if (ui.guide.step >= ui.guide.steps.length - 1) {
            closeGuide();
            toast("新手引导完成。", "success");
            return;
          }
          ui.guide.step += 1;
          renderGuide();
          return;
        }

        if (action === "run-sample-project") {
          state.role = "L";
          state.notebook.kernel = "pytorch";
          state.notebook.codeByKernel.pytorch = `${KERNEL_SNIPPETS.pytorch}\n\n# Auto-filled demo block\nBATCH_SIZE = 32\nLEARNING_RATE = 1e-3`;
          state.activeView = "notebook";
          saveState();
          renderApp();
          runNotebook();
          toast("已自动填充示例项目并开始运行。", "success");
          return;
        }

        if (action === "reset-demo") {
          openModal("confirm-reset");
          return;
        }

        if (action === "confirm-reset-demo") {
          if (ui.timers.notebook) clearInterval(ui.timers.notebook);
          if (ui.timers.upload) clearInterval(ui.timers.upload);
          localStorage.removeItem(STORAGE_KEY);
          state = clone(DEFAULT_STATE);
          closeModal();
          renderApp();
          toast("演示数据已重置。", "success");
          return;
        }
      });

      document.addEventListener("change", (event) => {
        const target = event.target;
        if (target.id === "kernel-select") {
          state.notebook.kernel = target.value;
          saveState();
          renderView();
          return;
        }
        if (target.id === "upload-input") {
          const file = target.files && target.files[0];
          startUpload(file ? file.name : "mock_data.csv");
          saveState();
          return;
        }
      });

      document.addEventListener("input", (event) => {
        const target = event.target;
        if (target.id === "notebook-editor") {
          state.notebook.codeByKernel[state.notebook.kernel] = target.value;
          saveState();
          return;
        }
      });

      const uploadZoneEvents = ["dragenter", "dragover", "dragleave", "drop"];
      uploadZoneEvents.forEach((eventName) => {
        document.addEventListener(eventName, (event) => {
          const zone = document.getElementById("upload-zone");
          if (!zone) return;
          if (!event.target.closest("#upload-zone")) return;
          event.preventDefault();
          event.stopPropagation();
          if (eventName === "dragenter" || eventName === "dragover") {
            state.ui.draggingUpload = true;
            renderView();
          }
          if (eventName === "dragleave") {
            state.ui.draggingUpload = false;
            renderView();
          }
          if (eventName === "drop") {
            state.ui.draggingUpload = false;
            const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
            startUpload(file ? file.name : "drop_upload.csv");
            saveState();
          }
        });
      });

      window.addEventListener("resize", () => {
        Object.values(ui.charts).forEach((chart) => {
          if (chart && typeof chart.resize === "function") chart.resize();
        });
        if (ui.guide.active) renderGuide();
      });

      renderApp();
      if (typeof window.echarts === "undefined") {
        toast("图表库未加载，已启用 SVG 备用图表。", "warn");
      }
    })();
  </script>
</body>
</html>
